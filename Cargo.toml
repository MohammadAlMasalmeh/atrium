[package]
name = "atrium"
version = "0.1.0"
edition = "2021"
description = "A small Rust re-take on the Aside AI browser, powered by the opencode server API"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
block2 = "0.6"
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures-util = "0.3"
muda = "0.21"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSView", "NSResponder", "NSGraphics"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSError", "NSGeometry", "NSDictionary"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "objc2-app-kit", "block2"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1.29.0", features = ["v4"] }
wry = { version = "0.57", features = ["devtools"] }
