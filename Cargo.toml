[package]
name = "atrium"
version = "0.1.1"
edition = "2021"
description = "An experimental macOS developer browser in Rust, embedding Chromium through CEF"
license = "Apache-2.0"

[features]
default = ["chromium"]
webkit = ["dep:wry", "dep:tao", "dep:objc2-web-kit", "dep:objc2-quartz-core", "dep:block2"]
chromium = ["dep:cef", "dep:wry", "dep:objc2-web-kit"]

[[bin]]
name = "atrium"
path = "src/main.rs"

[[bin]]
name = "atrium_helper"
path = "src/bin/atrium_helper.rs"
required-features = ["chromium"]

[[bin]]
name = "atrium_bundle"
path = "src/bin/atrium_bundle.rs"
required-features = ["chromium"]

[[bin]]
name = "atrium_sign_update"
path = "src/bin/atrium_sign_update.rs"

[package.metadata.cef.bundle]
helper_name = "atrium_helper"

[dependencies]
cef = { version = "=156.1.0", optional = true, default-features = false, features = ["sandbox", "build-util"] }
anyhow = "1"
axum = "0.7"
base64 = "0.22"
block2 = { version = "0.6", optional = true }
clap = { version = "4", features = ["derive"] }
dirs = "5"
flate2 = "1"
futures-util = "0.3"
libc = "0.2"
muda = "0.21"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSView", "NSResponder", "NSGraphics", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSError", "NSGeometry", "NSDictionary"] }
objc2-quartz-core = { optional = true, version = "0.3", features = ["CALayer"] }
objc2-web-kit = { optional = true, version = "0.3", features = ["WKWebView", "WKSnapshotConfiguration", "objc2-app-kit", "block2"] }
ring = "0.17"
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = { version = "0.37", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1.29.0", features = ["v4"] }
wry = { optional = true, version = "0.57", features = ["devtools"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
