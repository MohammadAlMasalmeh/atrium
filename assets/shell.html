<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atrium</title>
<link rel="stylesheet" href="/onboarding.css">
<style>
/* Browser chrome in the established shape: an Arc/Zen sidebar (navigation,
   address, Favorites, per-space Pinned + Today tabs, space switcher), the page
   as a card, the assistant docked beside it, and a full chat view
   with a live preview of the agent's tab. The window itself is one Liquid
   Glass surface; the sidebar and side chat sit directly on it. */
:root {
  --fg: rgb(0 0 0 / .86); --fg-2: rgb(0 0 0 / .56); --fg-3: rgb(0 0 0 / .36);
  --hover: rgb(0 0 0 / .055); --press: rgb(0 0 0 / .1); --line: rgb(0 0 0 / .09);
  --selected: rgb(255 255 255 / .75); --selected-ring: rgb(0 0 0 / .06);
  --card: #fff; --card-ring: rgb(0 0 0 / .1); --field: rgb(0 0 0 / .05); --well: rgb(255 255 255 / .45);
  --menu: rgb(248 248 248 / .98); --menu-ring: rgb(0 0 0 / .12);
  --shadow: 0 0.5px 1.5px rgb(0 0 0 / .12), 0 6px 20px -8px rgb(0 0 0 / .2);
  --accent: AccentColor; --accent-soft: color-mix(in srgb, AccentColor 16%, transparent);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --window: #ececee;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: rgb(255 255 255 / .92); --fg-2: rgb(255 255 255 / .6); --fg-3: rgb(255 255 255 / .38);
    --hover: rgb(255 255 255 / .07); --press: rgb(255 255 255 / .12); --line: rgb(255 255 255 / .1);
    --selected: rgb(255 255 255 / .14); --selected-ring: rgb(255 255 255 / .08);
    --card: #1c1c1e; --card-ring: rgb(255 255 255 / .1); --field: rgb(255 255 255 / .08); --well: rgb(255 255 255 / .06);
    --menu: rgb(40 40 42 / .98); --menu-ring: rgb(255 255 255 / .12);
    --window: #1e1e20;
    --shadow: 0 0.5px 1.5px rgb(0 0 0 / .4), 0 8px 24px -8px rgb(0 0 0 / .55);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
/* WebKit draws the shell over native glass; Chromium can't composite through,
   so it gets the system window colour instead. */
html.opaque { background: var(--window); }
body { background: transparent; color: var(--fg); font: 13px/1.4 var(--font); -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none; cursor: default; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
[data-drag] { -webkit-app-region: drag; }
[data-drag] button, [data-drag] input, [data-drag] select { -webkit-app-region: no-drag; }
input, textarea { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--press); border-top-color: var(--fg-2); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }
.shimmer { background: linear-gradient(90deg, var(--fg-3) 30%, var(--fg) 50%, var(--fg-3) 70%); background-size: 200% 100%;
  -webkit-background-clip: text; color: transparent !important; animation: shimmer 1.8s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
kbd { font: 11px/16px var(--font); padding: 0 5px; border-radius: 4px; border: .5px solid var(--line); color: var(--fg-3); }
.ib { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--fg-2); flex: none; }
.ib:hover:not(:disabled) { background: var(--hover); color: var(--fg); }
.ib:active:not(:disabled) { background: var(--press); }
.ib:disabled { opacity: .3; }
.ib.on { color: var(--accent); }

#app { display: flex; height: 100vh; padding: 6px 6px 6px 0; }

/* ── Sidebar ─────────────────────────────────────────── */
#sidebar { width: 250px; flex: none; display: flex; flex-direction: column; padding: 0 8px 4px 10px;
  transition: margin-left .22s cubic-bezier(.3,.7,.2,1), opacity .18s; }
body.sb-hidden #sidebar { margin-left: -250px; opacity: 0; }
body.sb-hidden #app { padding-left: 6px; }
/* Drawn by AppKit on the window glass instead (ATRIUM_NATIVE_CHROME=1). */
.native-chrome .sb-top > button, .native-chrome #url, .native-chrome .sb-scroll { visibility: hidden; }
.sb-top { height: 40px; flex: none; display: flex; align-items: center; gap: 0; padding-left: 70px; }
.sb-top .grow { flex: 1; align-self: stretch; }
#url { height: 34px; flex: none; margin: 2px 0 10px; border-radius: 9px; background: var(--well); display: flex; align-items: center; gap: 7px; padding: 0 6px 0 10px;
  box-shadow: inset 0 0 0 .5px var(--line); position: relative; overflow: hidden; }
#url:hover { background: var(--selected); }
#url .lead { color: var(--fg-3); display: grid; }
#url .lead svg.i { width: 12px; height: 12px; stroke-width: 2; }
#url .h { flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#url .h.empty { color: var(--fg-3); }
#url .act { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: var(--fg-3); opacity: 0; }
#url:hover .act { opacity: 1; }
#url .act:hover { background: var(--press); color: var(--fg); }
#url .act svg.i { width: 13px; height: 13px; }
#url .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--accent); opacity: 0; }
body.loading #url .bar { width: 75%; opacity: 1; transition: width 5s cubic-bezier(.1,.6,.3,1); }
.sb-scroll { flex: 1; overflow-y: auto; min-height: 0; margin: 0 -4px; padding: 0 4px 8px; }
.sb-scroll::-webkit-scrollbar { width: 0; }
.favs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.fav { height: 42px; border-radius: 9px; background: var(--well); display: grid; place-items: center; box-shadow: inset 0 0 0 .5px var(--line); }
.fav:hover { background: var(--selected); }
.fav.active { background: var(--selected); box-shadow: 0 0 0 .5px var(--selected-ring), 0 1px 4px rgb(0 0 0 / .12); }
.fav img { width: 18px; height: 18px; border-radius: 4px; }
.space-head { display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 8px; font-weight: 600; font-size: 12px; color: var(--fg-2); }
.space-head i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.divider { height: .5px; background: var(--line); margin: 6px 8px; }
.row { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 8px; border-radius: 8px; color: var(--fg); position: relative; }
.row:hover { background: var(--hover); }
.row.active { background: var(--selected); box-shadow: 0 0 0 .5px var(--selected-ring), 0 1px 3px rgb(0 0 0 / .1); }
.row .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row img.fv, .row .fv { width: 16px; height: 16px; border-radius: 3px; flex: none; display: grid; place-items: center; color: var(--fg-3); }
.row .fv svg.i { width: 14px; height: 14px; }
.row.sleeping .t { color: var(--fg-2); }
.row .x { opacity: 0; width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; color: var(--fg-3); }
.row .x svg.i { width: 11px; height: 11px; }
.row:hover .x { opacity: 1; }
.row .x:hover { background: var(--press); color: var(--fg); }
.row.dim { color: var(--fg-2); }
.row .tag { font-size: 10.5px; color: var(--fg-3); }
.label { display: flex; align-items: center; justify-content: space-between; height: 28px; padding: 8px 4px 0 8px; font-size: 11px; font-weight: 600; color: var(--fg-3); }
.label .ib { width: 22px; height: 22px; }
.label .ib svg.i { width: 13px; height: 13px; }
.sb-bottom { flex: none; display: flex; align-items: center; height: 36px; gap: 2px; }
.spaces { flex: 1; display: flex; justify-content: center; align-items: center; }
.space-dot { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; }
.space-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--fg-3); transition: transform .15s; }
.space-dot:hover::before { background: var(--fg-2); }
.space-dot.on::before { background: var(--c); transform: scale(1.4); }

/* ── Main column ─────────────────────────────────────── */
#main { flex: 1; min-width: 0; display: flex; gap: 6px; }
#panes { flex: 1; min-width: 0; display: flex; gap: 6px; }
.pane { flex: 1; min-width: 0; border-radius: 10px; background: var(--card); position: relative; overflow: hidden; box-shadow: 0 0 0 .5px var(--card-ring), var(--shadow); }
#pane-split { display: none; }
body.split #pane-split { display: block; }
body.split #pane-main { box-shadow: 0 0 0 2px var(--accent-soft), 0 0 0 .5px var(--card-ring), var(--shadow); }
body.agent-here #pane-main { box-shadow: 0 0 0 2px var(--accent), 0 0 0 6px var(--accent-soft), var(--shadow); }
.page { position: absolute; inset: 0; overflow-y: auto; display: none; }
.frozen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top left; display: none; }
body.is-frozen .frozen { display: block; }

/* Start page */
#ntp { background: var(--card); }
.start { max-width: 680px; margin: 0 auto; padding: max(40px, calc(20vh - 76px)) 32px 64px; }
.brand { display: flex; align-items: baseline; justify-content: center; gap: .26em; margin-bottom: 28px; color: var(--fg);
  font: 700 48px/1 -apple-system, "SF Pro Display", var(--font); letter-spacing: -.05em; user-select: none; }
.brand svg { width: .66em; height: .68em; fill: currentColor; flex: none; }
.omni { border-radius: 16px; background: var(--field); padding: 10px 10px 10px 14px; display: flex; align-items: flex-start; gap: 10px; }
.omni:focus-within { background: var(--card); box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft), 0 14px 34px -14px rgb(0 0 0 / .3); }
.omni svg.i { color: var(--fg-3); margin-top: 5px; }
.omni textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; font-size: 16px; line-height: 24px; height: 26px; padding: 1px 0; max-height: 140px; user-select: text; }
.omni textarea::placeholder { color: var(--fg-3); }
.seg { background: var(--field); border-radius: 8px; height: 28px; padding: 2px; display: inline-flex; flex: none; }
.seg button { padding: 0 11px; border-radius: 6px; color: var(--fg-2); font-size: 12px; font-weight: 500; }
.seg button.on { background: var(--card); color: var(--fg); box-shadow: 0 0 0 .5px var(--card-ring), 0 1px 3px rgb(0 0 0 / .14); }
@media (prefers-color-scheme: dark) { .seg button.on { background: rgb(255 255 255 / .16); } }
.omni-foot { display: flex; align-items: center; gap: 10px; margin: 8px 6px 0; color: var(--fg-3); font-size: 11.5px; min-height: 22px; }
.omni-foot .grow { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border-radius: 5px; position: relative; color: var(--fg-2); font-size: 11.5px; }
.chip:hover { background: var(--hover); color: var(--fg); }
.chip select { position: absolute; inset: 0; opacity: 0; }
.chip svg.i { width: 11px; height: 11px; }
.sec { margin-top: 40px; }
.sec h2 { font-size: 12px; font-weight: 600; color: var(--fg-3); margin: 0 0 8px 8px; }
.rows .r { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 8px; border-radius: 8px; }
.rows .r:hover { background: var(--hover); }
.rows .r svg.i { width: 14px; height: 14px; color: var(--fg-3); }
.rows .r img { width: 16px; height: 16px; border-radius: 3px; }
.rows .r .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rows .r .s { color: var(--fg-3); font-size: 12px; white-space: nowrap; }

/* Full chat view */
#chatpage { display: none; flex-direction: column; background: var(--card); }
.cp-head { height: 46px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 16px; }
.cp-head .t { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pip { position: absolute; top: 54px; right: 16px; width: 300px; z-index: 2; border-radius: 12px; overflow: hidden; display: none;
  background: var(--field); box-shadow: 0 0 0 .5px var(--card-ring), 0 10px 30px -10px rgb(0 0 0 / .35); transition: transform .15s; }
#pip:hover { transform: scale(1.015); }
#pip.on { display: block; }
#pip img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top left; background: var(--field); }
#pip .cap { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; font-size: 11.5px; color: var(--fg-2); background: var(--card); border-top: .5px solid var(--line); }
#pip .cap img { width: 12px; height: 12px; aspect-ratio: auto; border-radius: 2px; background: none; }
#pip .cap .h { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#pip .cap .open { color: var(--fg-3); }
.chat-host { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#chatpage .log .inner { max-width: 720px; margin: 0 auto; }
@media (max-width: 1500px) { body.pip #chatpage .log .inner { margin: 0 340px 0 auto; margin-left: max(16px, calc((100% - 340px - 720px) / 2)); } }
#chatpage .composer .box { max-width: 720px; margin: 0 auto; }

/* Docked chat */
#side { width: 380px; flex: none; display: none; flex-direction: column; }
body.side-open #side { display: flex; }
.side-head { height: 40px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 2px 0 10px; }
.side-head .t { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Thread contents */
.log { flex: 1; overflow-y: auto; padding: 6px 0 10px; }
.inner { padding: 0 16px; display: flex; flex-direction: column; gap: 12px; }
#side .inner { padding: 0 10px 0 8px; }
.u { align-self: flex-end; background: var(--field); padding: 6px 12px; border-radius: 15px; max-width: 86%; white-space: pre-wrap; user-select: text; line-height: 1.45; }
.u .mention { color: var(--accent); }
.a { user-select: text; font-size: 13px; line-height: 1.62; overflow-wrap: anywhere; }
.a > :first-child { margin-top: 0; } .a > :last-child { margin-bottom: 0; }
.a p { margin: 0 0 9px; }
.a ul, .a ol { margin: 0 0 9px; padding-left: 18px; } .a li { margin: 3px 0; } .a li::marker { color: var(--fg-3); }
.a h3 { font-size: 13px; font-weight: 650; margin: 14px 0 6px; }
.a strong { font-weight: 600; }
.a code { background: var(--field); padding: 1px 4px; border-radius: 4px; font: 11.5px var(--mono); }
.a pre { background: var(--field); padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 0 0 9px; }
.a pre code { background: none; padding: 0; }
.a blockquote { margin: 0 0 9px; padding-left: 10px; border-left: 2px solid var(--line); color: var(--fg-2); }
.a hr { border: 0; border-top: .5px solid var(--line); margin: 12px 0; }
.a a { color: var(--accent); text-decoration: none; }
.a a:hover { text-decoration: underline; }
.a a img.lf { width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
.tbl { margin: 2px 0 10px; border-radius: 9px; box-shadow: 0 0 0 .5px var(--line); overflow-x: auto; background: var(--card); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 12.5px; line-height: 1.4; }
.tbl th { text-align: left; font-weight: 600; color: var(--fg-2); font-size: 11.5px; background: var(--field); }
.tbl th, .tbl td { padding: 6px 10px; border-bottom: .5px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.act-head { display: flex; align-items: center; gap: 8px; min-height: 24px; color: var(--fg-2); font-size: 12px; }
.act-head:hover { color: var(--fg); }
.act-head .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act-head .chev { width: 12px; height: 12px; transition: transform .15s; color: var(--fg-3); }
.act.open .act-head .chev { transform: rotate(90deg); }
.act-body { display: none; margin: 2px 0 4px 6px; padding-left: 12px; border-left: 1px solid var(--line); }
.act.open .act-body { display: block; }
.favs-stack { display: flex; }
.favs-stack img { width: 14px; height: 14px; border-radius: 3px; margin-left: -3px; box-shadow: 0 0 0 1.5px var(--card); background: var(--card); }
.favs-stack img:first-child { margin-left: 0; }
.step { display: flex; align-items: center; gap: 8px; padding: 2px 0; font-size: 12px; color: var(--fg-2); }
.step svg.i { width: 12px; height: 12px; color: var(--fg-3); }
.step img { width: 12px; height: 12px; border-radius: 2px; }
.step .d { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg-3); }
.step .k { color: var(--fg-3); font-size: 11px; }
.step.error { color: #d93025; }
.plan { border-radius: 10px; background: var(--field); padding: 8px 12px; font-size: 12.5px; }
.plan .ph { font-size: 11px; font-weight: 600; color: var(--fg-3); margin-bottom: 4px; }
.plan .it { display: flex; gap: 8px; align-items: flex-start; padding: 2px 0; }
.plan .bx { width: 13px; height: 13px; border-radius: 4px; box-shadow: inset 0 0 0 1.2px var(--fg-3); flex: none; margin-top: 2px; display: grid; place-items: center; }
.plan .it.done .bx { background: var(--accent); box-shadow: none; color: #fff; }
.plan .it.done .bx svg.i { width: 9px; height: 9px; stroke-width: 3; }
.plan .it.done span { color: var(--fg-3); text-decoration: line-through; }
.plan .it.now .bx { box-shadow: inset 0 0 0 1.5px var(--accent); }
.meta-line { font-size: 11px; color: var(--fg-3); }
.err { color: #d93025; font-size: 12px; }
.perm { border-radius: 10px; padding: 10px 12px; background: var(--field); font-size: 12.5px; }
.perm .btns { display: flex; gap: 6px; margin-top: 8px; }
.perm button { padding: 3px 10px; border-radius: 6px; background: var(--card); box-shadow: 0 0 0 .5px var(--card-ring); }
.perm button.yes { background: var(--accent); color: #fff; box-shadow: none; }
.empty { padding: 32px 8px; color: var(--fg-3); line-height: 1.55; }
.empty b { display: block; color: var(--fg-2); font-weight: 600; margin-bottom: 4px; }
.empty .mark { display: block; width: 22px; height: 22px; margin-bottom: 12px; fill: var(--fg-3); }
.composer { flex: none; padding: 4px 10px 10px; position: relative; }
#side .composer { padding: 4px 4px 4px 0; }
.box { background: var(--card); border-radius: 12px; padding: 8px 8px 6px 10px; display: flex; flex-direction: column; gap: 4px;
  box-shadow: 0 0 0 .5px var(--card-ring), 0 2px 6px -2px rgb(0 0 0 / .14); }
.box:focus-within { box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px var(--accent-soft); }
.box textarea { border: 0; outline: 0; resize: none; background: none; font-size: 13px; line-height: 1.45; max-height: 160px; min-height: 20px; padding: 1px 0; user-select: text; }
.box textarea::placeholder { color: var(--fg-3); }
.box .bar { display: flex; align-items: center; gap: 4px; margin-left: -4px; }
.box .bar .grow { flex: 1; }
.mentions { display: flex; gap: 4px; flex-wrap: wrap; }
.mentions:empty { display: none; }
.mchip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 4px 0 6px; border-radius: 6px; background: var(--field); max-width: 180px; font-size: 11.5px; }
.mchip img { width: 12px; height: 12px; border-radius: 2px; }
.mchip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mchip button { color: var(--fg-3); width: 14px; height: 14px; display: grid; place-items: center; }
.mchip button svg.i { width: 10px; height: 10px; }
.mchip.ctx { color: var(--fg-2); background: transparent; box-shadow: inset 0 0 0 .5px var(--line); }
.send { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.send svg.i { width: 13px; height: 13px; stroke-width: 2.2; }
.popup { position: absolute; left: 10px; right: 10px; bottom: calc(100% - 2px); background: var(--menu); border-radius: 9px;
  box-shadow: 0 0 0 .5px var(--menu-ring), 0 10px 30px -8px rgb(0 0 0 / .3); padding: 5px; display: none; max-height: 260px; overflow-y: auto; z-index: 5; }
.popup.open { display: block; }
.popup .pi { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px; border-radius: 5px; }
.popup .pi.sel { background: var(--accent); color: #fff; }
.popup .pi.sel .k { color: rgb(255 255 255 / .8); }
.popup .pi img { width: 14px; height: 14px; border-radius: 3px; }
.popup .pi .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.popup .pi .k { color: var(--fg-3); font-size: 12px; }
.popup .ph { font-size: 11px; font-weight: 600; color: var(--fg-3); padding: 4px 8px 2px; }

/* ── Overlays: command bar + Glance ──────────────────── */
#overlay { position: fixed; inset: 0; display: none; z-index: 10; }
body.overlay #overlay { display: block; }
#overlay .scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .12); }
@media (prefers-color-scheme: dark) { #overlay .scrim { background: rgb(0 0 0 / .35); } }

  background: var(--menu); padding: 7px 12px; border-radius: 8px; box-shadow: 0 0 0 .5px var(--menu-ring), var(--shadow); font-size: 12px; }

<script>
if (!window.webkit?.messageHandlers) document.documentElement.classList.add('opaque');
// The Chromium host exposes only this same-origin command channel to the shell.
window.ipc ||= { postMessage(body) { return fetch('/api/browser/command', { method: 'POST', headers: { 'content-type': 'application/json' }, body }).catch(console.error); } };
window.addEventListener('error', (e) => window.ipc && window.ipc.postMessage(JSON.stringify({ cmd: 'log', msg: `${e.message} @${e.lineno}:${e.colno}` })));
window.addEventListener('unhandledrejection', (e) => window.ipc && window.ipc.postMessage(JSON.stringify({ cmd: 'log', msg: 'unhandled: ' + (e.reason && e.reason.stack || e.reason) })));
</script>
<script>
try {
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ipc = (msg) => window.ipc && window.ipc.postMessage(JSON.stringify(msg));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem('atrium.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('atrium.' + k, JSON.stringify(v)); } catch {} } };
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
const ICON_OVERRIDES = { 'mail.google.com': 'https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico' };
const favicon = (u, icon) => icon || ICON_OVERRIDES[host(u)] || (host(u) ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host(u))}&sz=64` : '');
const ago = (t) => { const s = (Date.now() - t) / 1000; if (s < 60) return 'now'; if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h'; return Math.floor(s / 86400) + 'd'; };
const ICON = {
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  cursor: '<path d="m4 4 7 17 2.5-7.5L21 11Z"/>',
  keyboard: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  scroll: '<path d="M12 5v14M7 14l5 5 5-5"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/>',
  code: '<path d="m8 16-4-4 4-4M16 8l4 4-4 4"/>',
  tabs: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M7 7V4h14v13"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chat: '<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 20 12Z"/>',
  split: '<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M12 4.5v15"/>',
  plus: '<path d="M12 6v12M6 12h12"/>',
  x: '<path d="M17 7 7 17M7 7l10 10"/>',
  chev: '<path d="m9 6 6 6-6 6"/>',
  check: '<path d="m5 12 5 5 9-10"/>',
  copy: '<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
  sidebar: '<rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9 4.5v15"/>',
  pin: '<path d="M12 17v4M9 3h6l-1 6 3 3v2H7v-2l3-3Z"/>',
};
const icon = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24">${ICON[n] || ICON.globe}</svg>`;
let toastTimer;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 1600); }
async function post(url, body) {
  try { return await (await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })).json(); }
  catch (e) { return { error: String(e) }; }
}

/* ── State ─────────────────────────────────────────── */
const SPACE_COLORS = ['#0a84ff', '#bf5af2', '#30d158', '#ff9f0a', '#ff375f', '#64d2ff'];
const S = {
  tabs: [], active: null, split: null, glance: null,
  view: 'tab',                       // 'tab' | 'chat' (full chat view)
  side: false, overlay: null, ntpMode: 'search',
  sessions: [], models: [], model: store.get('model', null),
  hist: store.get('history', []),
  favs: store.get('favs', ['https://www.google.com', 'https://mail.google.com', 'https://github.com', 'https://www.youtube.com',
                           'https://x.com', 'https://www.reddit.com', 'https://news.ycombinator.com', 'https://en.wikipedia.org']),
  spaces: store.get('spaces3', [{ id: 1, name: 'Personal', color: 0 }, { id: 2, name: 'Work', color: 1 }]),
  space: store.get('space', 1),
  pinned: store.get('pinned', {}),   // space id -> [{ url, title }]
  tabSpace: new Map(), lastTab: new Map(),
  agentTabs: new Map(),              // session id -> tab the agent works in
};
const spaceColor = (sp) => SPACE_COLORS[(sp?.color || 0) % SPACE_COLORS.length];
const curSpace = () => S.spaces.find((s) => s.id === S.space) || S.spaces[0];
const tabById = (id) => S.tabs.find((t) => t.id === id);
const activeTab = () => tabById(S.active);
const spaceTabs = () => S.tabs.filter((t) => t.kind === 'web' && (S.tabSpace.get(t.id) ?? S.space) === S.space);
const pinnedHere = () => (S.pinned[S.space] ||= []);
const onWeb = () => { const t = activeTab(); return S.view === 'tab' && !!t && t.kind === 'web'; };
const agentTabOf = (sid) => { const id = S.agentTabs.get(sid); return id != null && tabById(id) ? id : null; };

/* ── Rust → shell ──────────────────────────────────── */
window.atriumShell = {
  state(st) {
    const prev = S.active;
    S.tabs = st.tabs.filter((t) => t.kind !== 'scratch'); S.active = st.active; S.split = st.split; S.glance = st.glance;
    for (const t of S.tabs) if (!S.tabSpace.has(t.id)) S.tabSpace.set(t.id, S.space);
    const sp = S.tabSpace.get(S.active);
    if (sp != null && sp !== S.space && st.reveal) { S.space = sp; store.set('space', sp); }
    if (S.active != null) S.lastTab.set(S.space, S.active);
    if (st.reveal && S.active !== prev && S.view === 'chat' && activeTab()?.kind === 'web') { S.view = 'tab'; S.side = true; }
    const t = activeTab(); if (t && t.kind === 'web' && !t.loading && t.title) remember(t);
    if (S.overlay === 'glance' && !S.glance) S.overlay = null;
    render();
  },
  cmd(name) {
    switch (name) {
      case 'commandBar': openCmdk(''); break;
      case 'editUrl': openCmdk(onWeb() ? activeTab().url : '', true); break;
      // Report now as well: hidden or busy windows can delay the next animation frame.
      case 'toggleSidebar': document.body.classList.toggle('sb-hidden'); layoutNow(); layoutSoon(); break;
      case 'toggleAssistant': toggleSide(); break;
      case 'toggleSplit': toggleSplit(); break;
      case 'newChat': newChat(true); break;
      case 'bookmark': togglePin(); break;
      case 'copyUrl': copyUrl(); break;
      case 'glanceOpened': S.overlay = 'glance'; freeze(); render(); break;
    }
  },
  // The agent is working in tab `id`.
  agent(id) {
    if (chat.id) S.agentTabs.set(chat.id, id);
    if (!S.tabSpace.has(id)) S.tabSpace.set(id, S.space);
    pip.refresh(true); render();
  },
  frozen(slot, url) {
    if (slot === 'pip') { pip.show(url); return; }
    $('#frozen-' + slot).src = url; if (slot === 'main') { S.frozenUrl = url; alignBackdrops(); }
  },
  toast,
  sidebar: (a) => sidebarAction(a),
};
function remember(t) {
  if (S.hist[0] && S.hist[0].url === t.url) { S.hist[0].title = t.title; return; }
  S.hist = [{ url: t.url, title: t.title, t: Date.now() }, ...S.hist.filter((h) => h.url !== t.url)].slice(0, 400);
  store.set('history', S.hist);
}

/* ── Rendering ─────────────────────────────────────── */
// State pushes arrive for every title, address, and loading change in any tab.
// Keep unchanged children so favicons don't re-decode and spinners don't restart.
function patch(el, html) {
  if (el._html === html) return;
  el._html = html;
  const next = document.createElement('template'); next.innerHTML = html;
  const pool = new Map();
  for (const c of el.children) { if (c._src) (pool.get(c._src) || pool.set(c._src, []).get(c._src)).push(c); }
  const want = [...next.content.children].map((c) => {
    const src = c.outerHTML, reuse = pool.get(src)?.shift();
    if (reuse) return reuse;
    c._src = src; return c;
  });
  want.forEach((c, i) => { if (el.children[i] !== c) el.insertBefore(c, el.children[i] || null); });
  while (el.children.length > want.length) el.lastElementChild.remove();
}
function render() {
  const t = activeTab();
  const web = onWeb(), chatView = S.view === 'chat', ntp = !web && !chatView;
  const split = web && S.split != null && tabById(S.split)?.kind === 'web';
  const working = chat.busy && !!chat.id;
  document.documentElement.style.setProperty('--c', spaceColor(curSpace()));
  $('#ntp').style.display = ntp ? 'block' : 'none';
  $('#chatpage').style.display = chatView ? 'flex' : 'none';
  document.body.classList.toggle('split', !!split);
  document.body.classList.toggle('loading', web && !!t.loading);
  document.body.classList.toggle('side-open', S.side && web);
  document.body.classList.toggle('overlay', !!S.overlay);
  document.body.classList.toggle('cmdk', S.overlay === 'cmdk');
  document.body.classList.toggle('glance', S.overlay === 'glance');
  document.body.classList.toggle('onboarding', S.overlay === 'onboarding');
  document.body.classList.toggle('is-frozen', !!S.overlay && web);
  document.body.classList.toggle('agent-here', working && web && agentTabOf(chat.id) === t.id);
  for (const id of ['#back', '#fwd', '#reload']) $(id).disabled = !web;
  $('#assist').classList.toggle('on', S.side && web);

  // Address
  const h = $('#url-host');
  if (web) { h.textContent = host(t.url) || t.url; h.classList.remove('empty'); patch($('#url-lead'), t.url.startsWith('https:') ? icon('lock') : icon('globe')); }
  else { h.textContent = chatView ? (chat.title || 'New Chat') : 'Search or enter address'; h.classList.toggle('empty', !chatView); patch($('#url-lead'), chatView ? icon('chat') : icon('search')); }
  $('#url-copy').style.display = $('#url-pin').style.display = web ? '' : 'none';

  // The one chat component lives in the full view or the side dock.
  const host_ = chatView ? $('#chat-main') : $('#chat-side');
  if (chat.el.parentElement !== host_) host_.appendChild(chat.el);
  $('#cp-title').textContent = $('#side-title').textContent = chat.title || 'New Chat';
  chat.renderMentions();
  pip.render(chatView);

  if (ntp) renderStart();
  renderSidebar();
  if (S.overlay) requestAnimationFrame(alignBackdrops);
  if (S.overlay === 'glance') layoutGlance();
  const overlay = !!S.overlay && S.overlay !== 'glance';
  ipc({ cmd: 'cover', on: !web || overlay, web, overlay });

}

/* ── Layout sync ──────────────────────────────────── */
let layoutQueued = false, layoutInFlight = false, layoutAgain = false;
function layoutSoon() {
  if (layoutQueued) return; layoutQueued = true;
  requestAnimationFrame(() => { layoutQueued = false; layoutNow(); });
}
// The Chromium shell's IPC is a fetch per message, and concurrent fetches can be
// handled out of order. Keep one layout in flight so a stale rect never wins.
function layoutNow() {
  if (layoutInFlight) { layoutAgain = true; return; }
  const r = (el) => { const b = el.getBoundingClientRect(); return { x: b.left, y: b.top, w: b.width, h: b.height }; };
  const msg = { cmd: 'layout', main: r($('#pane-main')), sidebar: !document.body.classList.contains('sb-hidden'), list: r($('.sb-scroll')) };
  if (document.body.classList.contains('split')) msg.split = r($('#pane-split'));
  if (S.overlay === 'glance') msg.glance = r($('#glance-frame'));
  layoutInFlight = true;
  Promise.resolve(window.ipc && window.ipc.postMessage(JSON.stringify(msg))).finally(() => {
    layoutInFlight = false;
    if (layoutAgain) { layoutAgain = false; layoutNow(); }
  });
}

// Hand something to the assistant. From the start page it becomes a new

/* ── Markdown: paragraphs, lists, tables, quotes, code, links ── */
function inline(t) {

  return esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*\w])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, (_, txt, url) => link(url, txt))
    .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, (_, pre, url) => pre + link(url, esc(host(url.replace(/&amp;/g, '&')) || url)));
}
function md(src) {
  const out = [];
  src.split(/```/).forEach((b, i) => {
    if (i % 2) { out.push('<pre><code>' + esc(b.replace(/^[^\n]*\n/, '')) + '</code></pre>'); return; }
    const lines = b.split('\n');
    let list = null, para = [];
    const flushPara = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
    const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
    for (let j = 0; j < lines.length; j++) {
      const line = lines[j];
      if (/^\s*\|.*\|\s*$/.test(line) && j + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[j + 1])) {
        flushPara(); closeList();
        const cells = (l) => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
        const head = cells(line); j += 2;
        const rows = [];
        while (j < lines.length && /^\s*\|.*\|\s*$/.test(lines[j])) rows.push(cells(lines[j++]));
        j--;
        out.push(`<div class="tbl"><table><thead><tr>${head.map((h) => `<th>${inline(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
        continue;
      }
      const ul = line.match(/^\s*[-*•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/), h = line.match(/^(#{1,4})\s+(.*)/), q = line.match(/^>\s?(.*)/);
      if (ul || ol) {
        flushPara();
        const kind = ul ? 'ul' : 'ol';
        if (list !== kind) { closeList(); out.push(`<${kind}>`); list = kind; }
        out.push('<li>' + inline((ul || ol)[1]) + '</li>');
        continue;
      }
      if (!line.trim() && list) continue;
      closeList();
      if (h) { flushPara(); out.push(`<h3>${inline(h[2])}</h3>`); }
      else if (q) { flushPara(); out.push(`<blockquote>${inline(q[1])}</blockquote>`); }
      else if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); out.push('<hr>'); }
      else if (!line.trim()) flushPara();
      else para.push(line);
    }
    flushPara(); closeList();
  });
  return out.join('');
}

const STEP = {
  snapshot: ['eye', 'Looked at', 'Looking at'], read_page: ['file', 'Read', 'Reading'], screenshot: ['camera', 'Captured', 'Capturing'],
  tabs: ['tabs', 'Checked tabs', 'Checking tabs'], click: ['cursor', 'Clicked', 'Clicking'], type: ['keyboard', 'Typed', 'Typing'],
  select_option: ['cursor', 'Selected', 'Selecting'], press_key: ['keyboard', 'Pressed', 'Pressing'], scroll: ['scroll', 'Scrolled', 'Scrolling'],
  batch: ['cursor', 'Ran', 'Running'], navigate: ['globe', 'Opened', 'Opening'], open_tab: ['tabs', 'Opened', 'Opening'],
  switch_tab: ['tabs', 'Switched to', 'Switching to'], close_tab: ['tabs', 'Closed tab', 'Closing tab'], evaluate: ['code', 'Extracted data', 'Extracting data'],
  wait: ['clock', 'Waited', 'Waiting'], search: ['search', 'Searched', 'Searching'], fetch: ['file', 'Read', 'Reading'],
  webfetch: ['file', 'Read', 'Reading'], websearch: ['search', 'Searched', 'Searching'],

function stepInfo(part) {
  const name = part.tool.replace(/^atrium_/, '');
  const st = part.state?.status || 'pending';
  const [ic, done, doing] = STEP[name] || ['code', name, name];
  const a = part.state?.input || {};
  const out = part.state?.output || '';
  let d = '', site = '';
  if (a.url && /^(back|forward|reload)$/.test(a.url)) d = a.url;
  else if (a.url) { site = a.url.includes('://') ? a.url : 'https://' + a.url; d = host(site) || a.url; }
  else if (a.query) d = `"${a.query}"`;
  else if (name === 'batch') d = `${(a.steps || []).length} steps`;
  else if (a.text) d = `"${String(a.text).slice(0, 40)}"`;
  else if (a.key) d = a.key;
  const page = /(?:Now on|Page): (.*?) — (https?:\S+)/.exec(out);
  if (page) { site = site || page[2]; if (!d) d = page[1] || host(page[2]); }
  if (!d && (name === 'snapshot' || name === 'read_page')) d = 'the page';
  return { ic, label: st === 'completed' || st === 'error' ? done : doing, detail: d.slice(0, 70), st, site, err: part.state?.error };
}

        <div class="btns"><button class="yes" data-r="once">Allow once</button><button data-r="always">Always</button><button data-r="reject">Deny</button></div>`);
      $$('button', el).forEach((b) => b.onclick = async () => {
        await post('/api/permission', { id: p.id, reply: b.dataset.r });
        el.outerHTML = `<div class="meta-line">${b.dataset.r === 'reject' ? 'Denied' : 'Allowed'} ${esc(p.permission)}</div>`;
      });
      break;
    }
  }
}

// Handle for poking at the UI from /api/debug/shell.
window.__shell = { S, chat, render, fillModels, refreshModels, askAgent, openCmdk, openChat, newChat, md, store, toast, post, ipc };

/* ── Boot ───────────────────────────────────────────── */
(async () => {
  chat.reset(); setNtpMode('search'); render();
  const es = new EventSource('/api/events');
  es.onmessage = (m) => { try { onEvent(JSON.parse(m.data)); } catch (e) { console.error(e); } };
  ipc({ cmd: 'ready' });
  await refreshModels(); refreshSessions();
  setTimeout(() => ob.focus(), 60);
  setInterval(refreshSessions, 20000);
})();
} catch (e) { window.ipc && window.ipc.postMessage(JSON.stringify({ cmd: 'log', msg: 'boot: ' + e + ' ' + e.stack })); }
</script>
<script src="/onboarding.js"></script>
